<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ededed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>私人聊天</title>
<style>
/* ============================================================
   基础
   ============================================================ */
*, *::before, *::after {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

:root {
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --wx-green: #95ec69;
  --wx-bg: #ededed;
  --wx-line: rgba(0, 0, 0, .07);
  --wx-text: #111111;
  --wx-sub: #9a9a9a;
  --app-top: 0px;
  --app-height: 100dvh;
}

[hidden] { display: none !important; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
               "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  font-size: 16px;
  line-height: 1.4;
  color: var(--wx-text);
  background: #d8d8d8;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
}

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: none;
  color: inherit;
}

input, textarea {
  font-family: inherit;
  font-size: 16px; /* 防止 iOS 聚焦时自动放大 */
}

/* ============================================================
   应用容器 —— 跟随可视视口（处理手机输入法弹出）
   ============================================================ */
#app {
  position: fixed;
  left: 0;
  right: 0;
  top: var(--app-top);
  height: var(--app-height);
  overflow: hidden;
  background: var(--wx-bg);
}

.view {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--wx-bg);
}

/* 二级页面：从右侧滑入 */
.page-view {
  transform: translateX(100%);
  visibility: hidden;
  transition: transform .3s cubic-bezier(.32, .72, .28, 1), visibility .3s;
  z-index: 20;
  box-shadow: -6px 0 24px rgba(0, 0, 0, .10);
}

.page-view.active {
  transform: translateX(0);
  visibility: visible;
}

/* ============================================================
   顶栏
   ============================================================ */
.topbar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 4px;
  height: calc(48px + var(--sat));
  padding: var(--sat) 8px 0;
  background: #ededed;
  border-bottom: 1px solid var(--wx-line);
  position: relative;
  z-index: 5;
}

.topbar-title {
  flex: 1 1 auto;
  text-align: center;
  font-size: 16px;
  font-weight: 500;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  padding: 0 4px;
}

.icon-btn {
  flex: 0 0 auto;
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  color: #4a4a4a;
  transition: background .15s;
}

.icon-btn:active {
  background: rgba(0, 0, 0, .06);
}

.chat-title {
  flex: 1 1 auto;
  min-width: 0;
  text-align: center;
  padding: 0 4px;
}

.chat-title .name {
  font-size: 16px;
  font-weight: 500;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.chat-title .sub {
  font-size: 11px;
  color: var(--wx-sub);
  margin-top: 1px;
}

/* ============================================================
   聊天区域
   ============================================================ */
.chat-scroll {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  background: var(--wx-bg);
  padding: 14px 12px 16px;
}

.messages {
  max-width: 860px;
  margin: 0 auto;
  width: 100%;
}

.messages:empty::after {
  content: "开始和 TA 聊天吧";
  display: block;
  text-align: center;
  color: #b3b3b3;
  font-size: 14px;
  padding: 60px 0;
}

/* ---------- 消息行 ---------- */
.msg-row {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  margin-bottom: 15px;
  max-width: 100%;
  animation: msgIn .18s ease-out;
}

.msg-row.me {
  flex-direction: row-reverse;
}

@keyframes msgIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ---------- 头像 ---------- */
.avatar {
  flex: 0 0 auto;
  width: 40px;
  height: 40px;
  border-radius: 6px;
  background-color: #cfcfcf;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 16px;
  font-weight: 500;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}

.avatar-lg {
  width: 46px;
  height: 46px;
  font-size: 18px;
}

/* ---------- 气泡 ---------- */
.bubble {
  position: relative;
  max-width: 72%;
  padding: 9px 12px;
  border-radius: 6px;
  font-size: 16px;
  line-height: 1.45;
  white-space: pre-wrap;
  word-break: break-word;
  overflow-wrap: anywhere;
}

.ta .bubble {
  background: #ffffff;
}

.me .bubble {
  background: var(--wx-green);
}

.ta .bubble::after,
.me .bubble::after {
  content: "";
  position: absolute;
  top: 13px;
  width: 0;
  height: 0;
  border: 6px solid transparent;
}

.ta .bubble::after {
  left: -12px;
  border-right-color: #ffffff;
}

.me .bubble::after {
  right: -12px;
  border-left-color: var(--wx-green);
}

@media (min-width: 720px) {
  .bubble { max-width: 520px; }
}

/* ---------- 正在输入 ---------- */
.typing-bubble {
  display: flex;
  align-items: center;
  gap: 5px;
  height: 38px;
  padding: 0 14px;
}

.typing-bubble span {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #c4c4c4;
  animation: typingBlink 1.2s infinite ease-in-out;
}

.typing-bubble span:nth-child(2) { animation-delay: .18s; }
.typing-bubble span:nth-child(3) { animation-delay: .36s; }

@keyframes typingBlink {
  0%, 60%, 100% { opacity: .3; transform: translateY(0); }
  30%           { opacity: 1;  transform: translateY(-3px); }
}

/* ============================================================
   底部输入栏
   ============================================================ */
.input-bar {
  flex: 0 0 auto;
  background: #f7f7f7;
  border-top: 1px solid var(--wx-line);
  padding: 8px 10px calc(8px + var(--sab));
}

.input-bar-inner {
  max-width: 860px;
  margin: 0 auto;
  display: flex;
  align-items: flex-end;
  gap: 8px;
}

#input {
  flex: 1 1 auto;
  min-width: 0;
  min-height: 38px;
  max-height: 110px;
  padding: 8px 11px;
  border: 1px solid #dcdcdc;
  border-radius: 6px;
  background: #fff;
  line-height: 20px;
  resize: none;
  outline: none;
  overflow-y: auto;
  -webkit-appearance: none;
  appearance: none;
  transition: border-color .15s;
}

#input:focus {
  border-color: #b9b9b9;
}

#btnSend {
  flex: 0 0 auto;
  height: 38px;
  padding: 0 18px;
  border-radius: 6px;
  background: #07c160;
  color: #fff;
  font-size: 15px;
  font-weight: 500;
  transition: background .15s, opacity .15s;
  user-select: none;
}

#btnSend:active { background: #06ad56; }

#btnSend:disabled {
  background: #d0d0d0;
  color: #f2f2f2;
  cursor: default;
}

/* ============================================================
   二级页面通用
   ============================================================ */
.page-body {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding: 12px 12px calc(28px + var(--sab));
}

.page-body > * {
  max-width: 720px;
  margin-left: auto;
  margin-right: auto;
}

/* ============================================================
   字卡页面
   ============================================================ */
.card-editor {
  background: #fff;
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 14px;
  box-shadow: 0 1px 3px rgba(0, 0, 0, .05);
}

#cardInput {
  width: 100%;
  min-height: 84px;
  max-height: 220px;
  padding: 10px 11px;
  border: 1px solid #e2e2e2;
  border-radius: 8px;
  background: #fafafa;
  line-height: 1.5;
  resize: vertical;
  outline: none;
  -webkit-appearance: none;
  appearance: none;
  transition: border-color .15s, background .15s;
}

#cardInput:focus {
  border-color: #07c160;
  background: #fff;
}

.card-editor .row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  margin-top: 10px;
}

.row-btns {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-left: auto;
}

.hint {
  font-size: 13px;
  color: var(--wx-sub);
}

#btnAddCard {
  flex: 0 0 auto;
  height: 38px;
  padding: 0 20px;
  border-radius: 8px;
  background: #07c160;
  color: #fff;
  font-size: 15px;
  font-weight: 500;
  transition: background .15s;
}

#btnAddCard:active { background: #06ad56; }

/* ---------- 批量导入 / 拼音造卡 面板 ---------- */
.batch-panel {
  background: #fff;
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 14px;
  box-shadow: 0 1px 3px rgba(0, 0, 0, .05);
  animation: msgIn .18s ease-out;
}

.batch-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 10px;
}

.batch-head .title {
  font-size: 15px;
  font-weight: 500;
}

.batch-close {
  flex: 0 0 auto;
  width: 30px;
  height: 30px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  line-height: 1;
  color: #9a9a9a;
  transition: background .15s;
}

.batch-close:active { background: rgba(0, 0, 0, .06); }

#batchInput {
  width: 100%;
  min-height: 120px;
  max-height: 260px;
  padding: 10px 11px;
  border: 1px solid #e2e2e2;
  border-radius: 8px;
  background: #fafafa;
  font-size: 15px;
  line-height: 1.5;
  resize: vertical;
  outline: none;
  -webkit-appearance: none;
  appearance: none;
  transition: border-color .15s, background .15s;
}

#batchInput:focus {
  border-color: #07c160;
  background: #fff;
}

.batch-modes {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 18px;
  margin-top: 10px;
}

.mode-opt {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 14px;
  color: #555;
  user-select: none;
  -webkit-user-select: none;
}

.mode-opt input {
  width: 16px;
  height: 16px;
  margin: 0;
  accent-color: #07c160;
}

.batch-foot {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 12px;
}

.batch-foot .row-btns { margin-left: auto; }

.primary-btn {
  flex: 0 0 auto;
  height: 38px;
  padding: 0 20px;
  border-radius: 8px;
  background: #07c160;
  color: #fff;
  font-size: 15px;
  font-weight: 500;
  transition: background .15s;
}

.primary-btn:active { background: #06ad56; }

/* ---------- 拼音造卡 ---------- */
#pinyinInput {
  width: 100%;
  height: 42px;
  padding: 0 11px;
  border: 1px solid #e2e2e2;
  border-radius: 8px;
  background: #fafafa;
  font-size: 16px;
  letter-spacing: .5px;
  outline: none;
  -webkit-appearance: none;
  appearance: none;
  transition: border-color .15s, background .15s;
}

#pinyinInput:focus {
  border-color: #07c160;
  background: #fff;
}

.pinyin-preview {
  margin-top: 10px;
  min-height: 48px;
  padding: 11px 12px;
  border-radius: 8px;
  background: #f2fbf5;
  color: #1a1a1a;
  font-size: 20px;
  line-height: 1.4;
  letter-spacing: 1px;
  word-break: break-word;
  overflow-wrap: anywhere;
}

.pinyin-preview.empty {
  color: #b3b3b3;
  font-size: 14px;
  letter-spacing: 0;
}

.pinyin-syllables {
  margin-top: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 280px;
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}

.pinyin-syllables:empty { display: none; }

.pys-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.pys-label {
  flex: 0 0 auto;
  width: 60px;
  font-size: 12px;
  color: #9a9a9a;
  text-align: right;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.pys-chars {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 2px 0;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}

.pys-chars::-webkit-scrollbar { display: none; }

.pys-char {
  flex: 0 0 auto;
  min-width: 38px;
  height: 36px;
  padding: 0 8px;
  border-radius: 8px;
  background: #f2f2f2;
  color: #333;
  font-size: 17px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background .15s, color .15s, transform .12s;
}

.pys-char.active {
  background: #07c160;
  color: #fff;
}

.pys-char:active { transform: scale(.93); }

/* ---------- 字卡列表 ---------- */
.card-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.card-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  background: #fff;
  border-radius: 10px;
  padding: 12px 12px 12px 14px;
  box-shadow: 0 1px 3px rgba(0, 0, 0, .05);
  animation: msgIn .18s ease-out;
}

.card-text {
  flex: 1 1 auto;
  min-width: 0;
  font-size: 15px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
  overflow-wrap: anywhere;
}

.card-del {
  flex: 0 0 auto;
  font-size: 13px;
  color: #e35d5d;
  padding: 4px 8px;
  border-radius: 6px;
  transition: background .15s;
}

.card-del:active { background: rgba(227, 93, 93, .1); }

.empty-tip {
  text-align: center;
  color: #b3b3b3;
  font-size: 14px;
  padding: 40px 0;
}

/* ============================================================
   设置页面
   ============================================================ */
.setting-group {
  background: #fff;
  border-radius: 10px;
  padding: 4px 14px;
  margin-bottom: 14px;
  box-shadow: 0 1px 3px rgba(0, 0, 0, .05);
}

.setting-title {
  font-size: 13px;
  color: var(--wx-sub);
  padding: 12px 0 8px;
}

.setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 0;
  border-top: 1px solid #f2f2f2;
  min-height: 52px;
}

.setting-row:first-of-type {
  border-top: none;
}

.setting-row label {
  flex: 0 0 auto;
  font-size: 15px;
  color: #333;
}

.setting-row input[type="text"] {
  flex: 1 1 auto;
  min-width: 0;
  text-align: right;
  border: none;
  outline: none;
  background: transparent;
  font-size: 15px;
  color: #333;
  padding: 4px 0;
}

.setting-row input[type="text"]::placeholder {
  color: #c0c0c0;
}

.avatar-picker {
  display: flex;
  align-items: center;
  gap: 12px;
}

.mini-btn {
  flex: 0 0 auto;
  height: 32px;
  padding: 0 14px;
  border-radius: 8px;
  background: #f2f2f2;
  color: #333;
  font-size: 13px;
  transition: background .15s;
}

.mini-btn:active { background: #e6e6e6; }

.bg-options {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  padding: 4px 0 14px;
}

.bg-swatch {
  width: 52px;
  height: 52px;
  border-radius: 10px;
  border: 2px solid transparent;
  background-size: cover;
  background-position: center;
  position: relative;
  transition: transform .15s, border-color .15s;
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .06);
}

.bg-swatch:active { transform: scale(.94); }

.bg-swatch.active {
  border-color: #07c160;
}

.bg-swatch-custom {
  display: flex;
  align-items: center;
  justify-content: center;
  background: #f5f5f5;
  color: #9a9a9a;
  font-size: 22px;
  font-weight: 300;
}

.danger-btn {
  display: block;
  width: 100%;
  height: 46px;
  border-radius: 8px;
  background: #fff;
  color: #e35d5d;
  font-size: 15px;
  text-align: center;
  margin: 8px 0;
  transition: background .15s;
}

.danger-btn:active { background: #fff5f5; }

.tip {
  font-size: 12px;
  color: #b3b3b3;
  line-height: 1.6;
  margin: 10px 0 14px;
}

/* ============================================================
   Toast
   ============================================================ */
#toast {
  position: fixed;
  left: 50%;
  bottom: calc(96px + var(--sab));
  transform: translateX(-50%) translateY(10px);
  max-width: 80vw;
  padding: 9px 16px;
  border-radius: 8px;
  background: rgba(0, 0, 0, .78);
  color: #fff;
  font-size: 14px;
  line-height: 1.4;
  text-align: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity .22s, transform .22s;
  z-index: 999;
  word-break: break-word;
}

#toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
</style>
</head>
<body>

<div id="app">

  <!-- ============ 聊天页 ============ -->
  <div class="view" id="viewChat">

    <header class="topbar">
      <button class="icon-btn" id="btnOpenCards" aria-label="字卡库">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="14" rx="2.6"/>
          <path d="M7 9.6h6.5M7 13.2h4.2"/>
        </svg>
      </button>

      <div class="chat-title">
        <div class="name" id="chatName">TA</div>
        <div class="sub">在线</div>
      </div>

      <button class="icon-btn" id="btnOpenSettings" aria-label="设置">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3.1"/>
          <path d="M19.1 14.6a1.5 1.5 0 0 0 .3 1.65l.05.05a1.9 1.9 0 1 1-2.7 2.7l-.05-.05a1.5 1.5 0 0 0-1.65-.3 1.5 1.5 0 0 0-.9 1.37V20a1.9 1.9 0 1 1-3.8 0v-.09a1.5 1.5 0 0 0-.98-1.37 1.5 1.5 0 0 0-1.65.3l-.05.05a1.9 1.9 0 1 1-2.7-2.7l.05-.05a1.5 1.5 0 0 0 .3-1.65 1.5 1.5 0 0 0-1.37-.9H4a1.9 1.9 0 1 1 0-3.8h.09a1.5 1.5 0 0 0 1.37-.98 1.5 1.5 0 0 0-.3-1.65l-.05-.05a1.9 1.9 0 1 1 2.7-2.7l.05.05a1.5 1.5 0 0 0 1.65.3h.07a1.5 1.5 0 0 0 .9-1.37V4a1.9 1.9 0 1 1 3.8 0v.09a1.5 1.5 0 0 0 .9 1.37 1.5 1.5 0 0 0 1.65-.3l.05-.05a1.9 1.9 0 1 1 2.7 2.7l-.05.05a1.5 1.5 0 0 0-.3 1.65v.07a1.5 1.5 0 0 0 1.37.9H20a1.9 1.9 0 1 1 0 3.8h-.09a1.5 1.5 0 0 0-1.37.9z"/>
        </svg>
      </button>
    </header>

    <main class="chat-scroll" id="chatScroll">
      <div class="messages" id="messages"></div>
    </main>

    <footer class="input-bar">
      <div class="input-bar-inner">
        <textarea id="input" rows="1" placeholder="发消息…"
                  enterkeyhint="send" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
        <button id="btnSend" disabled>发送</button>
      </div>
    </footer>

  </div>

  <!-- ============ 字卡页 ============ -->
  <div class="view page-view" id="viewCards">

    <header class="topbar">
      <button class="icon-btn" data-back="viewCards" aria-label="返回">
